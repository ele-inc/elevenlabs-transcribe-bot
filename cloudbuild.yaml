steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        SECRETS=(
          ELEVENLABS_API_KEY
          SLACK_BOT_TOKEN
          DISCORD_BOT_TOKEN
          DISCORD_PUBLIC_KEY
          DISCORD_APPLICATION_ID
          GCP_PROJECT_ID
          GOOGLE_CLIENT_EMAIL
          GOOGLE_IMPERSONATE_EMAIL
          GOOGLE_PRIVATE_KEY
          GOOGLE_GENERATIVE_AI_API_KEY
          YOUTUBE_PROXY
          YOUTUBE_COOKIES_BASE64
        )

        mapping=""
        for name in "$${SECRETS[@]}"; do
          mapping+="$${name}=$${name}:latest,"
        done
        mapping="$${mapping%,}"

        RESULTS_BUCKET="$PROJECT_ID-scribe-results"
        JOB_NAME="scribe-transcription-worker"
        HLS_ALLOWED_HOSTS="$_TRANSCRIPTION_HLS_ALLOWED_HOSTS"
        RUNTIME_ENV="MAX_CONCURRENT_TRANSCRIPTIONS=8,GEMINI_MODEL=gemini-3.6-flash,GCP_REGION=asia-northeast1,TRANSCRIPTION_JOB_NAME=$${JOB_NAME},TRANSCRIPTION_RESULTS_BUCKET=$${RESULTS_BUCKET},TRANSCRIPTION_HLS_ALLOWED_HOSTS=$${HLS_ALLOWED_HOSTS}"

        gcloud run deploy scribe-bot \
          --project="$PROJECT_ID" \
          --source=. \
          --region=asia-northeast1 \
          --memory=32Gi \
          --cpu=8 \
          --concurrency=8 \
          --timeout=3600 \
          --no-allow-unauthenticated \
          --execution-environment=gen2 \
          --cpu-boost \
          --no-cpu-throttling \
          --min-instances=0 \
          --max-instances=1 \
          --port=8080 \
          --set-env-vars="$${RUNTIME_ENV}" \
          --set-secrets="$${mapping}"

        SERVICE_IMAGE="$$(gcloud run services describe scribe-bot \
          --project="$PROJECT_ID" \
          --region=asia-northeast1 \
          --format='value(spec.template.spec.containers[0].image)')"

        gcloud run jobs deploy "$${JOB_NAME}" \
          --project="$PROJECT_ID" \
          --region=asia-northeast1 \
          --image="$${SERVICE_IMAGE}" \
          --command=deno \
          --args=run,--allow-net,--allow-env,--allow-read,--allow-write,--allow-run,job-worker.ts \
          --memory=32Gi \
          --cpu=8 \
          --tasks=1 \
          --max-retries=1 \
          --task-timeout=7200s \
          --set-env-vars="$${RUNTIME_ENV}" \
          --set-secrets="$${mapping}"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

substitutions:
  _TRANSCRIPTION_HLS_ALLOWED_HOSTS: ""
