openapi: 3.1.0
info:
  title: Scribe 文字起こし Web API
  version: 1.0.0
  description: |
    URLで指定された音声・動画を、永続化された非同期ジョブとして文字起こしするAPIです。
    ジョブIDを保存しておけば、クライアントの再読み込みや再起動後も状態と結果を取得できます。
servers:
  - url: "{serviceUrl}"
    description: Cloud Run サービス
    variables:
      serviceUrl:
        default: https://scribe-api.example.run.app
        description: デプロイ済みCloud RunサービスのURL
security:
  - bearerAuth: []
tags:
  - name: 文字起こしジョブ
    description: 非同期文字起こしジョブの作成、状態・結果取得、再試行
paths:
  /v1/transcription-jobs:
    post:
      tags: [文字起こしジョブ]
      operationId: createTranscriptionJob
      summary: 文字起こしジョブを作成する
      description: |
        非同期ジョブを登録します。`Idempotency-Key`を付けた同一内容の再送では、
        同じ呼び出し元の元のジョブを返します。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTranscriptionJobRequest"
            examples:
              standard:
                summary: 話者分離を行う例
                value:
                  sourceUrl: https://www.youtube.com/watch?v=example
                  options:
                    diarize: true
                    showTimestamp: true
                    tagAudioEvents: true
                    numSpeakers: 2
                    speakerNames: [田中, 山田]
                    summarize: false
      responses:
        "200":
          description: 冪等な再送で、元のジョブがすでに成功済み
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionJob"
        "202":
          description: ジョブを受け付けた、または元のジョブが処理中
          headers:
            Location:
              description: ジョブ状態の相対URL
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 同じ冪等キーが異なる内容ですでに使用されている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: ワーカーを開始できなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionJob"
  /v1/transcription-jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [文字起こしジョブ]
      operationId: getTranscriptionJob
      summary: ジョブ状態を取得する
      responses:
        "200":
          description: 現在のジョブ状態
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionJob"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/transcription-jobs/{jobId}/result:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [文字起こしジョブ]
      operationId: getTranscriptionJobResult
      summary: 文字起こし結果を取得する
      responses:
        "200":
          description: 完成した文字起こし結果
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionJobResult"
        "202":
          description: 結果はまだ完成していない
          headers:
            Retry-After:
              description: 次の取得まで待つ秒数
              schema:
                type: integer
                const: 5
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ジョブが失敗している
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailedResult"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/transcription-jobs/{jobId}/retry:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [文字起こしジョブ]
      operationId: retryTranscriptionJob
      summary: 失敗したジョブを再試行する
      responses:
        "202":
          description: 再試行を受け付けた
          headers:
            Location:
              description: ジョブ状態の相対URL
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionJob"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ジョブが失敗状態ではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: ワーカーを再開できなかった
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Google署名済みOIDC IDトークン
      description: Cloud RunサービスURLをaudienceに指定したIDトークン
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: ジョブ作成時に返されたID
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        同一処理の重複作成を防ぐ、呼び出し元内で一意なキー。
        安全な再送のため指定を推奨します。
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    CacheControl:
      description: 応答を保存しない指定
      schema:
        type: string
        example: no-store
    PrivateCacheControl:
      description: 結果を共有キャッシュへ保存しない指定
      schema:
        type: string
        example: private, no-store
  responses:
    BadRequest:
      description: リクエスト形式または値が不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: IDトークンがない、または検証できない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 指定されたジョブが存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: 予期しないサーバーエラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateTranscriptionJobRequest:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl:
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 8192
          description: 対応サービス上の音声・動画URL
        options:
          $ref: "#/components/schemas/TranscriptionOptions"
    TranscriptionOptions:
      type: object
      properties:
        diarize:
          type: boolean
          default: true
          description: 話者分離を行う
        showTimestamp:
          type: boolean
          default: true
          description: 文字起こしにタイムスタンプを含める
        tagAudioEvents:
          type: boolean
          default: true
          description: 笑い声や音楽などの音声イベントを検出する
        numSpeakers:
          type: integer
          minimum: 1
          maximum: 32
          description: 想定話者数。diarizeがtrueの場合のみ指定可能
        speakerNames:
          type: array
          minItems: 1
          maxItems: 32
          description: CLIの--speaker-names相当の話者名候補。指定時は要素数を話者数として使用する
          items:
            type: string
            minLength: 1
            maxLength: 100
        summarize:
          type: boolean
          default: false
          description: 文字起こし結果の要約生成を試みる
    TranscriptionJob:
      type: object
      required:
        - id
        - status
        - createdAt
        - updatedAt
        - attempts
        - statusUrl
        - resultUrl
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/TranscriptionJobStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 0
        filename:
          type: string
        languageCode:
          type: [string, "null"]
        error:
          type: string
        statusUrl:
          type: string
        resultUrl:
          type: string
    TranscriptionJobStatus:
      type: string
      enum: [queued, processing, succeeded, failed]
    PendingResult:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TranscriptionJobStatus"
    FailedResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: failed
        error:
          type: string
    TranscriptionJobResult:
      type: object
      required: [jobId, transcript, languageCode, timings]
      properties:
        jobId:
          type: string
        transcript:
          type: string
        languageCode:
          type: [string, "null"]
        words:
          type: array
          items:
            $ref: "#/components/schemas/WordItem"
        timings:
          $ref: "#/components/schemas/TranscriptionTimings"
        summary:
          type: string
    WordItem:
      type: object
      required: [text, start]
      properties:
        text:
          type: string
        start:
          type: number
          description: 開始秒
        end:
          type: number
          description: 終了秒
        speaker_id:
          oneOf:
            - type: string
            - type: number
    TranscriptionTimings:
      type: object
      required:
        - conversionMs
        - fileReadMs
        - sttMs
        - speakerIdentificationMs
        - coreTotalMs
        - totalMs
        - inputBytes
        - processedBytes
      properties:
        conversionMs:
          type: number
        fileReadMs:
          type: number
        sttMs:
          type: number
        speakerIdentificationMs:
          type: number
        coreTotalMs:
          type: number
        totalMs:
          type: number
        inputBytes:
          type: integer
        processedBytes:
          type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        details: {}
